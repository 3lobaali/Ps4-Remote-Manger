name: Build Bisan Remote Receiver

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-pkg:
    name: Build PS4 PKG
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build EBOOT with OpenOrbis
        uses: OpenOrbis/toolchain-action@main
        with:
          version: v0.5.1
          command: cd PS4_RECEIVER_APP && make clean && make

      - name: List build output
        run: |
          find PS4_RECEIVER_APP -maxdepth 3 -type f \
            ( -name "*.elf" -o -name "eboot.bin" -o -name "*.pkg" ) \
            -print

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bisan-Remote-Receiver-Build
          path: |
            PS4_RECEIVER_APP/eboot.bin
            PS4_RECEIVER_APP/*.elf
            PS4_RECEIVER_APP/*.pkg
          if-no-files-found: error
