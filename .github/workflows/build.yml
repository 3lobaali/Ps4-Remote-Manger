name: Build PS4 Homebrew PKG

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-pkg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld cmake wget tar

      - name: Download & Setup OpenOrbis Toolchain
        run: |
          wget https://github.com/OpenOrbis/toolchain/releases/download/v0.5/Toolchain.tar.gz
          mkdir -p $HOME/OO_PS4_TOOLCHAIN
          tar -xzf Toolchain.tar.gz -C $HOME/OO_PS4_TOOLCHAIN
          echo "OO_PS4_TOOLCHAIN=$HOME/OO_PS4_TOOLCHAIN" >> $GITHUB_ENV
          echo "$HOME/OO_PS4_TOOLCHAIN/bin" >> $GITHUB_PATH

      - name: Locate Directory and Build PKG
        run: |
          # البحث تلقائياً عن أي مجلد يحتوي على كلمة PS4 لتفادي أخطاء الأسماء
          TARGET_DIR=$(find . -maxdepth 2 -type d -iname "*PS4*" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then
            TARGET_DIR="."
          fi
          echo "Building in directory: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          # تنزيل أيقونة مؤقتة تلقائياً في حال عدم وجود icon0.png
          if [ ! -f "icon0.png" ]; then
            wget -O icon0.png https://raw.githubusercontent.com/OpenOrbis/OpenOrbis-PS4-Toolchain/master/samples/hello_world/icon0.png || touch icon0.png
          fi
          
          make

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Remote-Receiver-PKG
          path: |
            **/*.pkg
