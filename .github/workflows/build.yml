name: Build PS4 Homebrew PKG

on:
  push:
    branches: [ "main" ]

jobs:
  build-pkg:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenOrbis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Clone and build toolchain
        run: |
          git clone https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git /tmp/oo-toolchain
          cd /tmp/oo-toolchain
          make

      - name: Set environment
        run: |
          echo "OO_PS4_TOOLCHAIN=/tmp/oo-toolchain" >> $GITHUB_ENV
          echo "/tmp/oo-toolchain/bin" >> $GITHUB_PATH

      - name: Build PS4 App
        run: |
          cd PS4_RECEIVER_APP
          make

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Remote-Receiver-PKG
          path: PS4_RECEIVER_APP/*.pkg      - name: Debug PKG output
        run: |
          echo "=== PKG FILES ==="
          find . -name "*.pkg" -o -name "*.PKG" || echo "NO PKG FOUND"

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Remote-Receiver-PKG
          path: PS4_RECEIVER_APP/*.pkg
